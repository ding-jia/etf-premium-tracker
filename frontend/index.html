<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 溢价率监控</title>
<link rel="stylesheet" href="style.css?v=4">
<link rel="stylesheet" href="bloomberg.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <h1>ETF 溢价率监控</h1>
    </div>
    <span class="subtitle">A股 · 标普 &amp; 纳指</span>
  </div>
  <div class="header-right">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">加载中</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换 Bloomberg 终端风格">BBG</button>
    <div class="update-info">
      <span id="updateTime">--</span>
      <button id="refreshBtn" title="手动刷新">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="columns">
  <section class="list-panel">
    <div>
      <div class="section-header">
        <h2><span class="badge badge-nasdaq">NASDAQ</span> 纳指 ETF</h2>
        <div class="section-controls">
          <span class="count" id="nasdaqCount">0 只</span>
            <select id="nasdaqSort" class="sort-select">
            <option value="premium-desc">溢价率 ↓</option>
            <option value="premium-asc">溢价率 ↑</option>
            <option value="fee-desc">费率 ↓</option>
            <option value="fee-asc">费率 ↑</option>
            <option value="amount-desc">成交额 ↓</option>
            <option value="amount-asc">成交额 ↑</option>
            <option value="scale-desc">规模 ↓</option>
            <option value="scale-asc">规模 ↑</option>
            <option value="code">代码</option>
            <option value="name">名称</option>
          </select>
        </div>
      </div>
      <div class="list-header">
        <span class="lh-star"></span>
        <span class="lh-code">代码</span>
        <span class="lh-name">名称</span>
        <span class="lh-manager">管理人</span>
        <span class="lh-fee">费率</span>
        <span class="lh-price">现价</span>
        <span class="lh-change">涨跌</span>
        <span class="lh-premium">溢价率</span>
        <span class="lh-label">状态</span>
        <span class="lh-amount">成交额</span>
        <span class="lh-scale">规模</span>
      </div>
      <div class="list" id="nasdaqGrid"></div>
    </div>
    <div>
      <div class="section-header">
        <h2><span class="badge badge-sp500">S&P 500</span> 标普 ETF</h2>
        <div class="section-controls">
          <span class="count" id="sp500Count">0 只</span>
          <select id="sp500Sort" class="sort-select">
            <option value="premium-desc">溢价率 ↓</option>
            <option value="premium-asc">溢价率 ↑</option>
            <option value="fee-desc">费率 ↓</option>
            <option value="fee-asc">费率 ↑</option>
            <option value="amount-desc">成交额 ↓</option>
            <option value="amount-asc">成交额 ↑</option>
            <option value="scale-desc">规模 ↓</option>
            <option value="scale-asc">规模 ↑</option>
            <option value="code">代码</option>
            <option value="name">名称</option>
          </select>
        </div>
      </div>
      <div class="list-header">
        <span class="lh-star"></span>
        <span class="lh-code">代码</span>
        <span class="lh-name">名称</span>
        <span class="lh-manager">管理人</span>
        <span class="lh-fee">费率</span>
        <span class="lh-price">现价</span>
        <span class="lh-change">涨跌</span>
        <span class="lh-premium">溢价率</span>
        <span class="lh-label">状态</span>
        <span class="lh-amount">成交额</span>
        <span class="lh-scale">规模</span>
      </div>
      <div class="list" id="sp500Grid"></div>
    </div>
  </section>

  <section class="chart-panel">
    <div class="chart-header">
      <h3 id="chartTitle">标普500ETF博时 (513500)</h3>
      <div class="ma-toggles">
        <span class="ma-toggle active" data-ma="ma5">MA5</span>
        <span class="ma-toggle active" data-ma="ma10">MA10</span>
        <span class="ma-toggle active" data-ma="ma20">MA20</span>
      </div>
    </div>
    <div class="chart-body">
      <canvas id="premiumChart"></canvas>
    </div>
  </section>
  </div>
</main>

<footer>
  <span>数据来源：腾讯财经</span>
  <span>IOPV 为实时估算净值，溢价率 = (现价 - IOPV) / IOPV × 100%</span>
  <span>点击刷新按钮更新数据</span>
</footer>

<script src="script.js?v=4"></script>
</body>
</html>
