<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ETF溢价率监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fa;--card:#fff;--text:#1f2937;--muted:#9ca3af;--border:#e5e7eb;--blue:#2563eb;--red:#dc2626;--green:#16a34a;--purple:#9333ea}
[data-theme=bloomberg]{--bg:#0a0a0a;--card:#141414;--text:#c8c8c8;--muted:#787878;--border:#2a2a2a;--blue:#ff8c00;--red:#ff4444;--green:#22c55e;--purple:#a855f7}
body{position:fixed;inset:0;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo svg{color:var(--blue)}
h1{font-size:1.1rem;font-weight:600}
.subtitle{font-size:.75rem;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:12px}
.status-badge{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:.75rem;background:#dcfce7;color:#16a34a}
.status-badge.closed{background:#fef2f2;color:#dc2626}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.theme-toggle{background:none;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem}
.update-info{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
#refreshBtn{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;border-radius:4px;display:flex}
#refreshBtn:hover{background:var(--border)}
#refreshBtn.spin svg{animation:spin .6s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
main{flex:1;min-height:0;padding:12px 16px;overflow:hidden}
.columns{display:flex;gap:12px;height:100%}
.list-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.list-panel>div{display:flex;flex-direction:column;flex:1;min-height:0}
.list-panel .list{flex:1;min-height:0;overflow-y:auto}
.chart-panel{flex:0 0 40%;min-width:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:8px;min-height:0;padding:12px;overflow:hidden}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-header h2{font-size:.9rem;display:flex;align-items:center;gap:8px}
.badge{font-size:.65rem;padding:2px 6px;border-radius:4px;font-weight:600;color:#fff}
.badge-nasdaq{background:#2563eb}
.badge-sp500{background:#9333ea}
.section-controls{display:flex;align-items:center;gap:8px}
.count{font-size:.75rem;color:var(--muted)}
.sort-select{font-size:.75rem;padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text)}
.list-header,.list-item{display:flex;align-items:center;gap:10px;font-size:.75rem}
.list-header{padding:6px 14px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);flex-shrink:0}
.list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0}
.list-item{padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.list-item:hover{background:var(--border)}
.list-item.selected{background:rgba(37,99,235,.1)}
[data-theme=bloomberg] .list-item.selected{background:rgba(255,140,0,.1)}
.list-item.watchlist{background:rgba(255,215,0,.05)}
/* 列宽与 frontend/style.css 的 .lh-* / .li-* 逐项一致，保证两端展示相同 */
.lh-star,.li-star{min-width:28px;padding:4px 5px;text-align:center;flex-shrink:0}
.li-star{cursor:pointer;font-size:1rem}
.lh-code,.li-code{min-width:48px;flex-shrink:0}
.li-code{font-weight:600;font-variant-numeric:tabular-nums}
.lh-name,.li-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh-manager,.li-manager{min-width:56px;flex-shrink:1;color:var(--muted)}
.lh-fee,.li-fee{min-width:40px;text-align:right;flex-shrink:1;font-variant-numeric:tabular-nums}
.lh-price,.li-price{min-width:44px;text-align:right;flex-shrink:1;font-variant-numeric:tabular-nums}
.lh-change,.li-change{min-width:48px;text-align:right;flex-shrink:1;font-variant-numeric:tabular-nums}
.lh-premium,.li-premium{min-width:56px;text-align:right;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums}
.lh-label,.li-label{min-width:40px;padding:1px 6px;flex-shrink:0;text-align:center;border-radius:3px}
.lh-amount,.li-amount{min-width:74px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.lh-scale,.li-scale{min-width:64px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.premium-up .li-premium{color:var(--red)}
.premium-down .li-premium{color:var(--green)}
.premium-purple .li-premium{color:var(--purple)}
.premium-up .li-label{background:rgba(220,38,38,.12);color:var(--red)}
.premium-down .li-label{background:rgba(22,163,74,.12);color:var(--green)}
.premium-purple .li-label{background:rgba(147,51,234,.12);color:var(--purple)}
.list-item.best-fee .li-fee{color:var(--green);font-weight:700}
.list-item.loading{opacity:.4;pointer-events:none}
.up{color:var(--red)}.down{color:var(--green)}
.chart-note{font-size:.7rem;color:var(--muted)}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-header h3{font-size:.85rem}
.ma-toggles{display:flex;gap:6px}
.ma-toggle{font-size:.7rem;padding:2px 8px;border-radius:4px;cursor:pointer;background:var(--border);color:var(--muted);transition:all .15s}
.ma-toggle.active{background:var(--blue);color:#fff}
.chart-body{flex:1;min-height:0;position:relative}
.chart-body canvas{width:100%!important;height:100%!important}
footer{padding:8px 16px;border-top:1px solid var(--border);font-size:.7rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;flex-shrink:0}
/* 手机端：解除"锁死一屏"，改为整页自然纵向滚动，列表不再被限高 */
@media(max-width:900px){
body{position:static;overflow:visible;height:auto;min-height:100%}
main{overflow:visible;height:auto;padding:10px 12px}
.columns{flex-direction:column;height:auto}
.list-panel{flex:none;width:100%}
.list{overflow-y:visible;max-height:none}
.chart-panel{flex:none;width:100%;min-height:300px}
.li-manager,.lh-manager{display:none}
}
/* 列对齐：表头与数据行共用同一套 flex 基准（仅靠 min-width 会被内容撑宽而错位） */
.lh-star,.li-star{flex:0 1 28px;min-width:0}
.lh-code,.li-code{flex:0 1 56px;min-width:0}
.lh-name,.li-name{flex:1 1 140px;min-width:0}
.lh-manager,.li-manager{flex:0 1 84px;min-width:0}
.lh-fee,.li-fee{flex:0 1 52px;min-width:0}
.lh-price,.li-price{flex:0 1 56px;min-width:0}
.lh-change,.li-change{flex:0 1 62px;min-width:0}
.lh-premium,.li-premium{flex:0 1 78px;min-width:0}
.lh-label,.li-label{flex:0 1 64px;min-width:0}
.lh-amount,.li-amount{flex:0 1 86px;min-width:0}
.lh-scale,.li-scale{flex:0 1 72px;min-width:0}
.list-header>span,.list-item>span{white-space:nowrap;overflow:hidden}
/* 手机端：裁掉次要列 + 折叠表头，否则 9 列挤进 358px 后关键数字全被截断。
   必须放在上面那组 flex 基准之后，否则列宽会被基础值覆盖。 */
@media(max-width:768px){
header{flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px}
.header-left,.header-right{justify-content:space-between}
.subtitle{display:none}
.li-manager,.lh-manager,.li-price,.lh-price,.li-fee,.lh-fee,.li-amount,.lh-amount,.li-scale,.lh-scale{display:none}
.list-header,.list-item{gap:6px;padding-left:10px;padding-right:10px}
.lh-star,.li-star{flex:0 0 22px;min-width:0}
.lh-code,.li-code{flex:0 0 52px;min-width:0}
.lh-name,.li-name{flex:1 1 auto;min-width:0}
.lh-change,.li-change{flex:0 0 58px;min-width:0}
.lh-premium,.li-premium{flex:0 0 68px;min-width:0}
.lh-label,.li-label{flex:0 0 52px;min-width:0}
}
</style>
</head>
<body>
<header>
<div class="header-left">
<div class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><h1>ETF溢价率监控</h1></div>
<span class="subtitle">A股 · 标普 &amp; 纳指</span>
</div>
<div class="header-right">
<div class="status-badge" id="statusBadge"><span class="status-dot"></span><span id="statusText">加载中</span></div>
<button class="theme-toggle" id="themeToggle" title="切换Bloomberg终端风格">BBG</button>
<div class="update-info"><span id="updateTime">--</span><button id="refreshBtn" title="刷新"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button></div>
</div>
</header>
<main><div class="columns">
<section class="list-panel">
<div><div class="section-header"><h2><span class="badge badge-nasdaq">NASDAQ</span> 纳指ETF</h2><div class="section-controls"><span class="count" id="nasdaqCount">0只</span><select id="nasdaqSort" class="sort-select"><option value="premium-desc">溢价率↓</option><option value="premium-asc">溢价率↑</option><option value="fee-desc">费率↓</option><option value="fee-asc">费率↑</option><option value="amount-desc">成交额↓</option><option value="amount-asc">成交额↑</option><option value="scale-desc">规模↓</option><option value="scale-asc">规模↑</option><option value="code">代码</option><option value="name">名称</option></select></div></div>
<div class="list-header"><span class="lh-star"></span><span class="lh-code">代码</span><span class="lh-name">名称</span><span class="lh-manager">管理人</span><span class="lh-fee">费率</span><span class="lh-price">现价</span><span class="lh-change">涨跌</span><span class="lh-premium">溢价率</span><span class="lh-label">状态</span><span class="lh-amount">成交额</span><span class="lh-scale">规模</span></div>
<div class="list" id="nasdaqGrid"></div></div>
<div><div class="section-header"><h2><span class="badge badge-sp500">S&amp;P500</span> 标普ETF</h2><div class="section-controls"><span class="count" id="sp500Count">0只</span><select id="sp500Sort" class="sort-select"><option value="premium-desc">溢价率↓</option><option value="premium-asc">溢价率↑</option><option value="fee-desc">费率↓</option><option value="fee-asc">费率↑</option><option value="amount-desc">成交额↓</option><option value="amount-asc">成交额↑</option><option value="scale-desc">规模↓</option><option value="scale-asc">规模↑</option><option value="code">代码</option><option value="name">名称</option></select></div></div>
<div class="list-header"><span class="lh-star"></span><span class="lh-code">代码</span><span class="lh-name">名称</span><span class="lh-manager">管理人</span><span class="lh-fee">费率</span><span class="lh-price">现价</span><span class="lh-change">涨跌</span><span class="lh-premium">溢价率</span><span class="lh-label">状态</span><span class="lh-amount">成交额</span><span class="lh-scale">规模</span></div>
<div class="list" id="sp500Grid"></div></div>
</section>
<section class="chart-panel">
<div class="chart-header"><h3 id="chartTitle">标普500ETF博时 (513500)</h3><span class="chart-note" id="chartNote"></span>
<div class="ma-toggles"><span class="ma-toggle active" data-ma="ma5">MA5</span><span class="ma-toggle active" data-ma="ma10">MA10</span><span class="ma-toggle active" data-ma="ma20">MA20</span></div></div>
<div class="chart-body"><canvas id="premiumChart"></canvas></div>
</section>
</div></main>
<footer><span>数据来源：腾讯财经</span><span>IOPV为实时估算净值，溢价率=(现价-IOPV)/IOPV×100%</span><span>点击刷新更新数据</span></footer>
<script src="script.js"></script>
</body>
</html>
